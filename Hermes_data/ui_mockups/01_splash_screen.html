<!DOCTYPE html>
<html>
<head>
<title>01 - Splash Screen</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    background-color: #F1F5F9;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: #0F172A;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 30px 20px;
  }
  /* Phone Shell Container */
  .phone-frame {
    width: 430px;
    height: 932px;
    background: #FFFFFF;
    border-radius: 54px;
    border: 12px solid #0F172A;
    box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 124px;
    height: 35px;
    background: #0F172A;
    border-radius: 20px;
    z-index: 999;
  }
  /* Status Bar */
  .status-bar {
    height: 52px;
    padding: 14px 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 700;
    z-index: 998;
    position: relative;
  }
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 5px;
    background: #0F172A;
    border-radius: 4px;
    z-index: 999;
  }
</style>

<style>
  .splash-body {
    background-color: #004AAD;
    color: #FFFFFF;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 70px 24px 40px;
    position: relative;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="dynamic-island"></div>
    <div class="splash-body">
      <svg width="110" height="104" viewBox="0 0 100 95" fill="none" style="transform: rotate(-15deg); position: absolute; top: -20px; left: -25px; z-index: 1; pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
<path d="M49.9297 0L61.7167 35.9311H99.8602L69.0014 58.1378L80.7884 94.0689L49.9297 71.8622L19.071 94.0689L30.8579 58.1378L-0.000778198 35.9311H38.1427L49.9297 0Z" fill="#FFFFFF"/>
</svg>
      <svg width="140" height="133" viewBox="0 0 100 95" fill="none" style="transform: rotate(20deg); position: absolute; top: 40px; right: -45px; z-index: 1; pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
<path d="M49.9297 0L61.7167 35.9311H99.8602L69.0014 58.1378L80.7884 94.0689L49.9297 71.8622L19.071 94.0689L30.8579 58.1378L-0.000778198 35.9311H38.1427L49.9297 0Z" fill="#1D4ED8"/>
</svg>
      <svg width="90" height="85" viewBox="0 0 100 95" fill="none" style="transform: rotate(-35deg); position: absolute; bottom: 120px; left: -25px; z-index: 1; pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
<path d="M49.9297 0L61.7167 35.9311H99.8602L69.0014 58.1378L80.7884 94.0689L49.9297 71.8622L19.071 94.0689L30.8579 58.1378L-0.000778198 35.9311H38.1427L49.9297 0Z" fill="#1D4ED8"/>
</svg>
      <svg width="130" height="123" viewBox="0 0 100 95" fill="none" style="transform: rotate(15deg); position: absolute; bottom: -20px; right: -30px; z-index: 1; pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
<path d="M49.9297 0L61.7167 35.9311H99.8602L69.0014 58.1378L80.7884 94.0689L49.9297 71.8622L19.071 94.0689L30.8579 58.1378L-0.000778198 35.9311H38.1427L49.9297 0Z" fill="#FFFFFF"/>
</svg>

      <div style="width: 100%; display: flex; justify-content: flex-end; z-index: 10;">
        <span style="font-size: 11px; font-weight: 700; background: #FFFFFF; color: #004AAD; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px;">Smart Cafe POS</span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 10; margin-top: -30px;">
        <!-- Brand Logo with Mascot on top of NG -->
        <div style="position: relative; display: inline-flex; align-items: flex-end; margin-bottom: 24px;">
          <div style="position: absolute; top: -48px; left: 142px;">

  <path d="M38 46 C40 43 44 43 46 46" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M54 46 C56 43 60 43 62 46" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="35" cy="51" r="2.5" fill="#FFFFFF" opacity="0.35"/>

  <path d="M44 54 Q50 62 56 54" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
          </div>
          <span style="font-size: 38px; font-weight: 900; color: #FFFFFF; letter-spacing: -0.5px;">NONGKRONG</span>
          <span style="font-size: 38px; font-weight: 900; color: #FFFFFF;">.id</span>
        </div>
        
        <p style="font-size: 15px; font-weight: 500; color: #E0E7FF; max-width: 260px; line-height: 1.5;">
          Tempat Nongkrong Asik, Pesan Praktis Tanpa Antri.
        </p>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; z-index: 10; width: 100%;">
        <div style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid #FFFFFF; border-top-color: transparent; animation: spin 1s linear infinite;"></div>
        <span style="font-size: 12px; font-weight: 600; color: #CBD5E1; letter-spacing: 0.5px;">Memuat Pengalaman Kafe...</span>
        <span style="font-size: 10px; color: #93C5FD; font-family: 'JetBrains Mono', monospace;">v2.4.0 • MariaDB 3NF Active</span>
      </div>
    </div>
    <div class="home-indicator" style="background: #FFFFFF;"></div>
  </div>
</body>
</html>
