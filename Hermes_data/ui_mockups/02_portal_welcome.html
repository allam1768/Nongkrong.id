<!DOCTYPE html>
<html>
<head>
<title>02 - Portal Welcome</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    background-color: #F1F5F9;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: #0F172A;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 30px 20px;
  }
  /* Phone Shell Container */
  .phone-frame {
    width: 430px;
    height: 932px;
    background: #FFFFFF;
    border-radius: 54px;
    border: 12px solid #0F172A;
    box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 124px;
    height: 35px;
    background: #0F172A;
    border-radius: 20px;
    z-index: 999;
  }
  /* Status Bar */
  .status-bar {
    height: 52px;
    padding: 14px 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 700;
    z-index: 998;
    position: relative;
  }
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 5px;
    background: #0F172A;
    border-radius: 4px;
    z-index: 999;
  }
</style>

<style>
  .portal-body {
    background-color: #FFFFFF;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 55px 24px 30px;
    position: relative;
    overflow: hidden;
  }
  .brand-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
  }
  .barista-container {
    position: relative;
    width: 100%;
    height: 380px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-top: 10px;
    z-index: 5;
  }
  .action-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    z-index: 10;
    margin-bottom: 10px;
  }
  .btn-primary {
    width: 100%;
    background-color: #004AAD;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 700;
    padding: 15px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(0, 74, 173, 0.25);
  }
  .btn-outline {
    width: 100%;
    background-color: #FFFFFF;
    color: #0F172A;
    font-size: 16px;
    font-weight: 700;
    padding: 14px;
    border-radius: 30px;
    border: 2px solid #E2E8F0;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="dynamic-island"></div>
    <div class="status-bar" style="color: #0F172A;">

        <span style="font-size: 12px;">5G</span>

    </div>

    <div class="portal-body">

          <div style="position: absolute; top: -34px; left: 102px;">

  <path d="M40 18 L36 8" stroke="#004AAD" stroke-width="4.5" stroke-linecap="round"/>

          </div>
          <span style="font-size: 28px; font-weight: 900; color: #004AAD; letter-spacing: -0.5px;">NONGKRONG</span>
          <span style="font-size: 28px; font-weight: 900; color: #004AAD;">.id</span>
        </div>
      </div>

      <!-- Barista Duo Center Vector/Image -->
      <div class="barista-container">
        <img src="file:///home/puutraa/Desktop/nongkrong_id/public/assets/img/baristas-portal.png" 
             style="max-width: 105%; max-height: 100%; object-fit: contain; object-position: bottom; pointer-events: none;" alt="Baristas">

      <!-- Action & Typography Section -->

        <h1 style="font-size: 26px; font-weight: 800; color: #000000; line-height: 1.25; margin-bottom: 8px;">
          Fall in Love with<br>

        <p style="font-size: 12px; color: #64748B; line-height: 1.5; margin-bottom: 24px; max-width: 290px;">

</html>
